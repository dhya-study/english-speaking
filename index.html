<title>KDH 영어 말하기 연습</title>
<style>
:root{--deep:#123d37;--ink:#183d37;--muted:#667e78;--bg:#f5f7f3;--card:#fff;--line:#dbe6e0;--main:#14745f;--pale:#eaf6ee;--teal:#f0f7f4;--warn:#a55230;--warnbg:#fff5e8;--bad:#b33242;--badbg:#fff0f1;--shadow:0 10px 38px rgba(14,56,43,.06);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);font-synthesis:none}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.46;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #8fcdb8;outline-offset:3px}
.shell{width:min(920px,100%);margin:auto;padding:0 19px 76px}.top{height:82px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:11px;min-width:0;background:none;border:0;padding:0;color:var(--deep);font-size:17px;font-weight:850;letter-spacing:-.7px}.brand-icon{display:grid;place-items:center;width:38px;height:38px;background:var(--deep);border-radius:13px;color:white;font-size:19px}.brand span:last-child{white-space:nowrap}.top-tag{font-size:12px;color:var(--muted);background:#eaf1ed;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.hero{margin:12px 0 24px}.eyebrow{color:var(--main);font-weight:850;letter-spacing:1px;font-size:12px}.hero h1{font-size:clamp(27px,5vw,40px);line-height:1.26;letter-spacing:-1.6px;margin:10px 0}.hero p{color:var(--muted);line-height:1.75;margin:10px 0 0;font-size:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:23px;box-shadow:var(--shadow)}.card+.card{margin-top:15px}.surface{background:#f4f8f5;border:1px solid #e3eee7;border-radius:15px;padding:18px}.label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.05em}.big{font-size:22px;line-height:1.58;letter-spacing:-.45px;word-break:keep-all}.sub{font-size:13px;color:var(--muted);line-height:1.65}.h2{font-size:19px;font-weight:850;letter-spacing:-.7px;margin:0 0 6px}.muted{color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:13px 18px;min-height:47px;font-weight:780;letter-spacing:-.25px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}.btn-main{background:var(--main);color:white}.btn-deep{background:var(--deep);color:white}.btn-outline{background:white;border:1px solid #cbdcd2;color:var(--ink)}.btn-soft{background:#eaf4ee;color:var(--deep)}.btn-ghost{background:transparent;color:var(--muted)}.btn-wide{width:100%}.mini{font-size:13px;min-height:42px;padding:10px 13px}.btn.warn{background:var(--badbg);color:var(--bad)}.btn:hover:not(:disabled){filter:brightness(.96)}
.info{display:flex;align-items:flex-start;gap:9px;color:#4b665e;font-size:13px;line-height:1.6;padding:13px 15px;border-radius:13px;background:var(--teal);margin-top:16px}.info strong{color:var(--deep)}.bullet{margin:0;padding-left:18px;line-height:1.85;color:var(--muted);font-size:14px}.import-panel{border:2px dashed #bcd4c8;background:#f7fbf8;border-radius:17px;padding:26px;text-align:center}.import-symbol{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:#e1f1e8;display:grid;place-items:center;font-size:26px}.import-panel p{margin:5px 0 18px;color:var(--muted);font-size:14px;line-height:1.7}.privacy{font-size:12px;color:var(--muted);line-height:1.65}.status{margin:14px 0;padding:13px 15px;border-radius:13px;background:var(--warnbg);color:var(--warn);font-size:13px;line-height:1.6}.status.ok{background:var(--pale);color:var(--deep)}.status.bad{background:var(--badbg);color:var(--bad)}
.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:17px}.course{background:var(--card);border:1px solid var(--line);border-radius:20px;text-align:left;padding:23px;box-shadow:var(--shadow);width:100%;min-height:154px;display:flex;flex-direction:column;justify-content:space-between;gap:17px}.course-icon{font-size:26px}.course h3{margin:0;font-size:21px;letter-spacing:-.5px}.course small{font-size:13px;color:var(--muted)}.course:hover{border-color:#93b4a3;transform:translateY(-1px)}.head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.back{background:none;border:0;color:var(--muted);font-weight:750;padding:9px 1px}.pill{color:var(--main);background:var(--pale);border-radius:999px;font-weight:800;padding:7px 11px;font-size:12px;white-space:nowrap}.search{width:100%;border:1px solid var(--line);border-radius:13px;background:white;padding:15px 16px;font-size:15px;margin-bottom:14px;outline-offset:2px}.passage-grid{display:grid;gap:10px}.passage{width:100%;padding:18px;text-align:left;border:1px solid var(--line);background:white;border-radius:17px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 13px rgba(19,65,44,.025)}.passage:hover{border-color:#99bfab}.passage-no{display:grid;place-items:center;background:var(--pale);width:41px;height:41px;flex:none;border-radius:12px;font-weight:900;color:var(--main);font-size:14px}.passage-text{flex:1;min-width:0}.passage-title{font-size:15px;font-weight:850;line-height:1.5;letter-spacing:-.35px}.passage-source{font-size:12px;color:var(--muted);margin-top:4px}.chev{color:#9ab5a6;font-size:23px}
.progress-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 9px}.progress-label{font-size:13px;color:var(--muted);font-weight:800}.progress-bar{height:8px;border-radius:999px;background:#e7ede9;overflow:hidden}.progress-bar>div{height:100%;background:var(--main);border-radius:999px;transition:width .2s}.translation{margin:18px 0 14px}.translation .big{margin:10px 0 1px}.recog{margin:12px 0}.output{min-height:108px;border:1px solid var(--line);border-radius:15px;background:#f9fbf8;padding:15px;line-height:1.9;font-size:17px;word-break:break-word}.placeholder{font-size:14px;color:#8ba59a}.interim{color:#97a79f;font-style:italic}.word-chip{display:inline}.word-chip.good{color:var(--ink)}.word-chip.wrong{background:var(--badbg);color:var(--bad);border-bottom:2px solid #d85868;padding:1px 2px;border-radius:3px;font-weight:750}.word-chip.missing{background:var(--warnbg);color:var(--warn);border-bottom:2px solid #d6a25b;padding:1px 2px;border-radius:3px;font-weight:750}.space{white-space:pre}.mic-wrap{text-align:center;padding:14px 0 9px}.mic{width:88px;height:88px;border-radius:999px;background:var(--main);color:white;border:0;box-shadow:0 10px 28px #14745f31;font-size:36px;display:inline-grid;place-items:center;transition:transform .15s}.mic:active{transform:scale(.96)}.mic.live{background:var(--bad);animation:pulse 2.2s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #b332423a}60%{box-shadow:0 0 0 17px #b3324200}}.mic-label{margin-top:11px;font-size:14px;font-weight:850}.mic-help{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px 0 17px}.tools .btn{flex:1}.outcome{border-radius:16px;padding:17px;margin-top:17px;background:var(--teal)}.outcome.bad{background:var(--badbg)}.outcome-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;margin-bottom:9px}.outcome-title.correct{color:var(--main)}.outcome-title.incorrect{color:var(--bad)}.answer{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;line-height:1.85;font-size:16px;margin:11px 0 0;word-break:break-word}.legend{font-size:12px;color:var(--muted);line-height:1.65;margin-top:10px}.scoreline{font-size:13px;color:var(--muted);margin-top:6px}.footer{border-top:1px solid var(--line);margin-top:32px;padding-top:19px;text-align:center;color:#8ba299;font-size:12px;line-height:1.7}.done{text-align:center;padding:55px 22px}.done-icon{font-size:48px;margin-bottom:14px}.done h2{font-size:26px;margin:0 0 9px}.empty{text-align:center;color:var(--muted);padding:24px}.noscript{padding:15px;background:var(--badbg);color:var(--bad)}.right{text-align:right}
@media(max-width:600px){.shell{padding:0 15px 55px}.top{height:73px}.top-tag{font-size:11px;padding:6px 8px}.card{padding:17px;border-radius:17px}.hero{margin:9px 0 18px}.hero h1{font-size:28px}.big{font-size:19px;line-height:1.68}.dashboard{gap:10px}.course{padding:16px;min-height:145px}.course h3{font-size:17px}.passage{padding:14px}.actions>.btn{flex:1}.mic{width:83px;height:83px}.tools .btn{font-size:13px}.output{font-size:16px}}
</style>
</head>
<body>
<div class="shell"><header class="top"><button type="button" class="brand" id="homeBtn" aria-label="홈으로 이동"><span class="brand-icon">🎙</span><span>영어 <b>말하기 마스터</b></span></button><span class="top-tag">나만의 내신 학습</span></header><main id="app" aria-live="polite"></main><footer class="footer">지문은 사용자 기기의 브라우저에만 저장됩니다.<br>음성 인식은 브라우저 서비스로 처리되며 인터넷이 필요할 수 있습니다.</footer></div>
<input type="file" id="privateFile" accept=".json,application/json" hidden />
<noscript><div class="noscript">이 앱은 JavaScript를 사용합니다. 브라우저에서 JavaScript를 허용해주세요.</div></noscript>
<script>
(()=>{
'use strict';
const DATA_KEY='kdh_speaking_private_data_v1';
const SpeechApi=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const root=document.getElementById('app');
const fileInput=document.getElementById('privateFile');
let passages=[];
let recog=null;
let nextSession=0;
let interim='';
let sessionFinal=[];
let baseWords=[];
let recognitionError='';
let pendingUndo=false;
const state={page:'home',kind:'booster',id:'',pos:0,query:'',checked:false,status:'',statusType:'',listening:false,stopping:false};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const words=s=>String(s??'').trim().split(/\s+/u).filter(Boolean);
const normalizeWord=s=>String(s).normalize('NFKC').toLowerCase().replace(/[’‘`]/gu,"'").replace(/[‐‑‒–—−-]/gu,' ').replace(/[^\p{L}\p{N}'\s]/gu,' ').trim();
const normWords=s=>words(String(s).replace(/[‐‑‒–—−-]/gu,' ')).map(normalizeWord).flatMap(v=>words(v)).filter(Boolean);
const byId=id=>passages.find(p=>p.id===id);
const current=()=>byId(state.id)?.items[state.pos];
const countKind=kind=>passages.filter(p=>p.kind===kind).length;
const totalCount=()=>passages.reduce((n,p)=>n+p.items.length,0);
const fullWords=()=>[...baseWords,...sessionFinal];
const spoken=()=>fullWords().join(' ');
const errorMessage=(err)=>{
 const map={
  'not-allowed':'브라우저에서 음성 인식을 거부했습니다. Chrome으로 HTTPS 주소에 접속하고 마이크 권한을 확인하세요.',
  'service-not-allowed':'브라우저 음성 인식 서비스가 거부되었습니다. Chrome 또는 네트워크 설정을 확인하세요.',
  'network':'음성 인식 서버 연결 오류입니다. 인터넷 연결을 확인한 뒤 다시 시도하세요.',
  'no-speech':'음성을 듣지 못했습니다. 마이크 버튼을 다시 눌러 말해보세요.',
  'audio-capture':'마이크 입력 장치를 사용할 수 없습니다. Galaxy 설정의 Chrome 마이크 권한을 확인하세요.',
  'language-not-supported':'영어 음성 인식을 지원하지 않는 환경입니다.',
  'aborted':'음성 인식이 중단되었습니다.'
 };
 return map[err]||`음성 인식 오류: ${err}`;
};
function verifyData(data){
 if(!data||data.format!=='kdh-private-speech-v1'||!Array.isArray(data.passages))throw Error('이 앱 전용 비공개 JSON 형식이 아닙니다.');
 const a=data.passages;
 if(a.length!==43||a.filter(x=>x.kind==='booster').length!==27||a.filter(x=>x.kind==='textbook').length!==16||a.reduce((n,p)=>n+(Array.isArray(p.items)?p.items.length:0),0)!==290)throw Error('지문 43개와 문장 290개가 모두 있는 파일을 선택해 주세요.');
 if(new Set(a.map(x=>x.id)).size!==43||a.some(p=>!p.id||!p.title||!p.source||!p.items?.length||p.items.some(s=>typeof s.en!=='string'||!s.en.trim()||typeof s.ko!=='string'||!s.ko.trim())))throw Error('지문 데이터의 일부가 손상되었거나 누락되었습니다.');
 return a;
}
function saveData(data){
 try{localStorage.setItem(DATA_KEY,JSON.stringify(data));return true}catch(e){return false}
}
function loadData(){
 try{const raw=localStorage.getItem(DATA_KEY);if(!raw)return;passages=verifyData(JSON.parse(raw));}catch(e){passages=[];try{localStorage.removeItem(DATA_KEY)}catch(_){} state.status='저장된 학습 데이터에 문제가 있어 다시 불러와야 합니다.';state.statusType='bad';}
}
function goHome(){endRecognition();state.page='home';state.checked=false;render();window.scrollTo(0,0)}
function goList(kind){endRecognition();state.page='list';state.kind=kind;state.query='';render();window.scrollTo(0,0)}
function start(id){if(!byId(id))return;endRecognition();state.id=id;state.pos=0;state.page='play';reset();window.scrollTo(0,0)}
function reset(){endRecognition();baseWords=[];sessionFinal=[];interim='';pendingUndo=false;state.checked=false;recognitionError='';render()}
function next(){if(!state.checked)return;endRecognition();const p=byId(state.id);if(state.pos+1>=p.items.length){state.page='done';render();return}state.pos++;reset();window.scrollTo(0,0)}
function endRecognition(){++nextSession;if(recog){try{recog.abort()}catch(_){}}recog=null;state.listening=false;state.stopping=false;interim='';sessionFinal=[];pendingUndo=false}
function openFilePicker(){fileInput.value='';fileInput.click()}
async function importFile(file){
 if(!file)return;
 try{
  if(file.size>2500000)throw Error('파일 크기가 너무 큽니다.');
  const data=JSON.parse(await file.text());
  const arr=verifyData(data);
  endRecognition();passages=arr;state.page='home';
  const saved=saveData(data);
  state.status=saved?'비공개 학습 자료 43개 지문·290개 문장을 불러왔습니다. 이 브라우저에만 저장했습니다.':'지문을 불러왔지만 저장 공간이 차단되었습니다. 새로 접속하면 다시 선택해야 합니다.';
  state.statusType=saved?'ok':'';
  render();
 }catch(e){state.status=`불러오기 실패: ${e.message||'파일 내용을 확인해 주세요.'}`;state.statusType='bad';render()}
}
function deleteData(){
 if(!window.confirm('이 기기에 저장된 지문을 삭제할까요? 삭제 후에는 다시 파일을 불러와야 합니다.'))return;
 endRecognition();passages=[];try{localStorage.removeItem(DATA_KEY)}catch(_){}
 state.page='home';state.status='저장된 지문을 삭제했습니다.';state.statusType='ok';render();
}
function startMic(){
 if(state.checked||state.listening||state.stopping)return;
 recognitionError='';
 if(!SpeechApi){recognitionError='이 브라우저에서는 Web Speech API 음성 인식을 지원하지 않습니다. 최신 Chrome에서 HTTPS 주소로 접속해 주세요.';render();return}
 if(!window.isSecureContext){recognitionError='현재 실행 환경은 보안 연결이 아닙니다. GitHub Pages의 https:// 주소에서 Chrome으로 실행하세요.';render();return}
 const session=++nextSession;sessionFinal=[];interim='';pendingUndo=false;
 let r;try{r=new SpeechApi()}catch(e){recognitionError=`음성 인식 생성 실패: ${e.message}`;render();return}
 recog=r;r.lang='en-US';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
 r.onstart=()=>{if(session!==nextSession)return;state.listening=true;state.stopping=false;render()};
 r.onresult=(event)=>{
  if(session!==nextSession)return;
  const finals=[];const temps=[];
  for(let i=0;i<event.results.length;i++){
   const item=event.results[i];const txt=String(item?.[0]?.transcript??'').trim();
   if(!txt)continue;
   if(item.isFinal)finals.push(txt);else temps.push(txt);
  }
  sessionFinal=words(finals.join(' '));interim=temps.join(' ').trim();render();
 };
 r.onerror=(ev)=>{if(session!==nextSession)return;if(ev.error!=='aborted')recognitionError=errorMessage(ev.error);render()};
 r.onend=()=>{
  if(session!==nextSession)return;
  baseWords.push(...sessionFinal);sessionFinal=[];interim='';recog=null;state.listening=false;state.stopping=false;
  if(pendingUndo){baseWords.pop();pendingUndo=false}
  render();
 };
 try{r.start();state.listening=true;state.stopping=false;render()}catch(e){recog=null;state.listening=false;recognitionError=`마이크 시작 실패: ${e.message||'Chrome 권한 및 연결을 확인해 주세요.'}`;render()}
}
function stopMic(undoAfter=false){
 if(!recog){if(undoAfter&&baseWords.length)baseWords.pop();render();return}
 pendingUndo=pendingUndo||undoAfter;
 state.stopping=true;state.listening=false;
 try{recog.stop()}catch(e){try{recog.abort()}catch(_){};baseWords.push(...sessionFinal);sessionFinal=[];recog=null;state.stopping=false;if(pendingUndo){baseWords.pop();pendingUndo=false}}
 render();
}
function undo(){if(state.checked)return;recognitionError='';if(recog){stopMic(true);return}baseWords.pop();render()}
function clearWords(){if(state.checked)return;if(recog){endRecognition()}baseWords=[];sessionFinal=[];interim='';recognitionError='';render()}
function check(){if(state.listening||state.stopping||recog)return;state.checked=true;recognitionError='';render()}
function align(expected,actual){
 const a=normWords(expected),b=normWords(actual),n=a.length,m=b.length;
 const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=0;i<=n;i++)dp[i][0]=i;
 for(let j=0;j<=m;j++)dp[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 let i=n,j=m;const rev=[];
 while(i||j){
  if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){
   rev.push({type:a[i-1]===b[j-1]?'good':'replace',expectedIndex:i-1,actualIndex:j-1});i--;j--;
  }else if(i>0&&dp[i][j]===dp[i-1][j]+1){rev.push({type:'missing',expectedIndex:i-1,actualIndex:null});i--}
  else{rev.push({type:'extra',expectedIndex:null,actualIndex:j-1});j--}
 }
 return rev.reverse();
}
function wordMarkup(alignment,side,originalText){
 const indexKey=side==='expected'?'expectedIndex':'actualIndex';
 const markings=new Map();
 for(const piece of alignment){
  const idx=piece[indexKey];if(idx!=null&&piece.type!=='good')markings.set(idx,piece.type);
 }
 let normalizedIndex=0;
 const chunks=[];
 for(const rawWord of words(originalText)){
  const normalizedParts=normWords(rawWord);
  let style='good';
  for(let k=0;k<normalizedParts.length;k++){
   const m=markings.get(normalizedIndex+k);
   if(!m)continue;
   if(side==='expected'&&m==='missing'){style='missing';break}
   style='wrong';
  }
  normalizedIndex+=normalizedParts.length;
  chunks.push(`<span class="word-chip ${style}">${escapeHtml(rawWord)}</span>`);
 }
 return chunks.join(' ')||'<span class="placeholder">입력한 단어가 없습니다.</span>';
}

function statusBar(){return state.status?`<div class="status ${state.statusType||''}" role="status">${escapeHtml(state.status)}</div>`:''}
function renderHome(){
 if(!passages.length)return `<div class="hero"><div class="eyebrow">PRIVATE SPEAKING PRACTICE</div><h1>해석을 보고,<br>영어 문장을 말해보세요.</h1><p>학습 자료는 GitHub에 올리지 않고 이 기기에서만 불러옵니다.<br>영어 원문 없이 공개할 수 있는 말하기 연습 웹앱입니다.</p></div><section class="card"><h2 class="h2">① 내 지문 불러오기</h2><p class="sub">처음 한 번만 비공개 JSON 파일을 선택하세요. 다음 방문부터는 이 브라우저에 저장된 지문으로 학습할 수 있습니다.</p><div class="import-panel"><div class="import-symbol">📂</div><strong>비공개 지문 파일 선택</strong><p>별도로 받은 <b>KDH_43지문_개인보관용.json</b> 파일을 선택합니다.</p><button class="btn btn-main btn-wide" data-action="import">지문 파일 불러오기</button></div>${statusBar()}<div class="info">🔒 <span>공개 웹사이트에는 지문을 포함하지 않았습니다. 가져온 데이터는 브라우저 저장 공간에만 보관됩니다. 단, Chrome 음성 인식은 음성을 외부 인식 서비스로 보낼 수 있습니다.</span></div></section><section class="card"><h2 class="h2">② 마이크로 연습</h2><ul class="bullet"><li>갤럭시 S26의 <b>Chrome</b>으로 <b>HTTPS GitHub Pages 주소</b>에 접속하세요.</li><li>한국어 해석만 보고 마이크 버튼을 누르면 됩니다.</li><li>말한 영어가 표시되고, 틀린 단어를 한 개씩 취소할 수 있습니다.</li><li>정답 확인 후 정확한 원문과 다른 부분을 표시합니다.</li></ul></section>`;
 return `<div class="hero"><div class="eyebrow">PRIVATE SPEAKING PRACTICE</div><h1>오늘은 어떤 지문을<br>말해볼까요?</h1><p>한국어 해석을 보고 영어로 대답하세요.<br>문장 순서와 원문의 단어를 엄격히 비교합니다.</p></div><section class="card"><div class="head-row" style="margin:0"><div><h2 class="h2">학습 자료 준비 완료</h2><p class="sub" style="margin:5px 0 0">부스터 27개 + 교과서 16개 · 총 ${totalCount()}개 항목</p></div><span class="pill">기기 저장</span></div>${statusBar()}<div class="dashboard"><button class="course" data-action="list" data-kind="booster"><span class="course-icon">📗</span><span><h3>BOOSTER</h3><small>부교재 ${countKind('booster')}개 지문</small></span></button><button class="course" data-action="list" data-kind="textbook"><span class="course-icon">📘</span><span><h3>영어Ⅱ 교과서</h3><small>Unit 3·4 · ${countKind('textbook')}개 지문</small></span></button></div></section><section class="card"><div class="head-row" style="margin:0"><div><h2 class="h2">내 지문 관리</h2><p class="sub" style="margin:5px 0 0">브라우저 저장 데이터를 지우면 다시 불러와야 합니다.</p></div></div><div class="actions" style="margin-top:15px"><button class="btn btn-outline mini" data-action="import">다른 지문 파일 불러오기</button><button class="btn btn-ghost mini warn" data-action="delete">기기에 저장된 지문 삭제</button></div></section>`;
}
function passageCard(p){return `<button class="passage" data-action="start" data-id="${escapeHtml(p.id)}"><span class="passage-no">${String(p.index).padStart(2,'0')}</span><span class="passage-text"><span class="passage-title">${escapeHtml(p.title)}</span><span class="passage-source">${escapeHtml(p.source)} · ${p.items.length}개 항목</span></span><span class="chev">›</span></button>`}
function filteredPassages(){const q=state.query.trim().toLocaleLowerCase();return passages.filter(p=>p.kind===state.kind&&`${p.title} ${p.source}`.toLocaleLowerCase().includes(q))}
function renderList(){const list=filteredPassages();return `<div class="head-row"><button class="back" data-action="home">‹ 전체 선택</button><span class="pill">${state.kind==='booster'?'BOOSTER 27개':'교과서 16개'}</span></div><div class="hero"><h1>${state.kind==='booster'?'BOOSTER':'영어Ⅱ 교과서'}</h1><p>지문을 누르면 첫 번째 문장부터 순서대로 진행합니다.</p></div><input class="search" id="passageSearch" placeholder="제목 또는 페이지 검색" value="${escapeHtml(state.query)}" aria-label="지문 검색"><div class="passage-grid" id="passageList">${list.map(passageCard).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}</div>`}
function renderPlay(){
 const p=byId(state.id);const item=current();
 if(!p||!item){return `<div class="status bad">지문을 찾을 수 없습니다.</div>`}
 const count=fullWords().length;const isDone=state.checked;const segments=isDone?align(item.en,spoken()):[];const correct=isDone&&segments.every(s=>s.type==='good')&&segments.length>0;
 const diff=segments.filter(s=>s.type!=='good').length;
 const display=!isDone?`${fullWords().map(w=>`<span class="word-chip good">${escapeHtml(w)}</span>`).join(' ')}${interim?` <span class="interim">${escapeHtml(interim)}</span>`:''}`:wordMarkup(segments,'actual',spoken());
 const micLabel=state.stopping?'인식 결과 정리 중…':state.listening?'듣고 있습니다 · 멈추려면 누르세요':'마이크를 눌러 영어로 말하기';
 return `<div class="head-row"><button class="back" data-action="list" data-kind="${p.kind}">‹ ${p.kind==='booster'?'부스터':'교과서'} 목록</button><span class="pill">${escapeHtml(p.source.match(/p\.\d+/)?.[0]||'문장 학습')}</span></div><div class="card"><h2 class="h2">${escapeHtml(p.title)}</h2><div class="progress-row"><span class="progress-label">문장 ${state.pos+1} / ${p.items.length}</span><span class="progress-label">${Math.round((state.pos+1)/p.items.length*100)}%</span></div><div class="progress-bar"><div style="width:${((state.pos+1)/p.items.length*100).toFixed(2)}%"></div></div><div class="translation surface"><div class="label">한국어 해석</div><p class="big">${escapeHtml(item.ko)}</p></div><div class="mic-wrap"><button class="mic ${state.listening?'live':''}" data-action="mic" aria-label="${state.listening?'음성 인식 정지':'음성 인식 시작'}" ${state.checked||state.stopping?'disabled':''}>${state.listening?'■':'🎙'}</button><div class="mic-label">${micLabel}</div><div class="mic-help">${state.listening?'현재 말한 영어가 아래에 실시간 표시됩니다.':'Chrome에서 마이크 권한을 허용해 주세요.'}</div></div><div class="recog"><div class="head-row" style="margin-bottom:8px"><div class="label">내가 말한 영어</div><span class="sub">${count}개 단어 인식</span></div><div class="output">${display||'<span class="placeholder">아직 인식된 단어가 없습니다.</span>'}</div></div>${recognitionError?`<div class="status bad" role="alert">${escapeHtml(recognitionError)}</div>`:''}${!isDone?`<div class="tools"><button class="btn btn-outline mini" data-action="undo" ${!fullWords().length?'disabled':''}>↶ 마지막 한 단어 취소</button><button class="btn btn-soft mini" data-action="clear" ${!fullWords().length&&!interim?'disabled':''}>처음부터</button></div><button class="btn btn-deep btn-wide" data-action="check" ${state.listening||state.stopping||!fullWords().length?'disabled':''}>정답 확인</button>`:
 `<div class="outcome ${correct?'':'bad'}"><div class="outcome-title ${correct?'correct':'incorrect'}">${correct?'✓ 정답입니다':'✕ 원문과 다릅니다'}</div><div class="scoreline">${correct?'모든 단어가 원문과 일치합니다.':`다른 단어·추가 단어·누락 단어를 합쳐 ${diff}개 차이가 있습니다.`}</div><div class="label" style="margin-top:15px">정답 원문</div><div class="answer">${wordMarkup(segments,'expected',item.en)}</div><div class="legend">${correct?'원문 일치':`<span style="color:#b33242;font-weight:800">빨간색</span>: 다르거나 추가된 단어 · <span style="color:#a55230;font-weight:800">주황색</span>: 원문에서 누락된 단어`}</div></div><div class="actions" style="margin-top:14px"><button class="btn btn-outline" data-action="retry">다시 풀기</button><button class="btn btn-main" data-action="next">${state.pos+1===p.items.length?'지문 완료':'다음 문장 →'}</button></div>`}</div><div class="info">ℹ️ <span>원문과 <b>단어 하나까지</b> 비교합니다. 대소문자·구두점은 무시하지만, 관사·시제·단수/복수 등이 다르면 오답입니다. 음성 인식 오류가 있으면 마지막 단어를 취소하고 다시 말하세요.</span></div>`;
}
function renderDone(){const p=byId(state.id);return `<div class="card done"><div class="done-icon">🎉</div><h2>지문 학습 완료</h2><p class="sub">${escapeHtml(p?.title||'')}의 ${p?.items.length||0}개 학습 항목을 모두 확인했습니다.</p><div class="actions" style="justify-content:center;margin-top:22px"><button class="btn btn-outline" data-action="start" data-id="${escapeHtml(p?.id||'')}">처음부터 다시 풀기</button><button class="btn btn-main" data-action="list" data-kind="${p?.kind||'booster'}">다른 지문 선택</button></div></div>`}
function render(){
 root.innerHTML=state.page==='home'?renderHome():state.page==='list'?renderList():state.page==='play'?renderPlay():renderDone();
}
root.addEventListener('click',e=>{
 const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;
 const {action,kind,id}=btn.dataset;
 if(action==='home')goHome();else if(action==='import')openFilePicker();else if(action==='delete')deleteData();else if(action==='list')goList(kind);else if(action==='start')start(id);else if(action==='mic'){state.listening?stopMic():startMic()}
 else if(action==='undo')undo();else if(action==='clear')clearWords();else if(action==='check')check();else if(action==='retry')reset();else if(action==='next')next();
});
root.addEventListener('input',e=>{
 if(e.target.id!=='passageSearch')return;
 state.query=e.target.value;
 document.getElementById('passageList').innerHTML=filteredPassages().map(passageCard).join('')||'<div class="empty">검색 결과가 없습니다.</div>';
});
fileInput.addEventListener('change',e=>importFile(e.target.files?.[0]));
document.getElementById('homeBtn').addEventListener('click',goHome);
loadData();render();
})();
</script>
</body>
</html>
